      <p>O <a href="https://woo.com/">Woo</a> é a principal plataforma de e-commerce de código aberto, responsável por 31,4% do primeiro milhão de lojas on-line.* Construído sobre o WordPress, o Woo capacita qualquer pessoa, em qualquer lugar, a vender qualquer coisa com extensibilidade, flexibilidade e controle verdadeiramente ilimitados sobre como constroem e desenvolvem seus negócios.</p>
