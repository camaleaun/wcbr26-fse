      <p>O WordCamp Brasil <span style="color: red;text-decoration: underline">YEAR</span> acontecerá em <span style="color: red;text-decoration: underline">DATA(S)</span>, em <span style="color: red;text-decoration: underline">NomeCidade CódigoEstado, LOCAL</span>.</p>
