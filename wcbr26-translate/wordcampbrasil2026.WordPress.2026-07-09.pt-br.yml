    content: |
      <!-- wp:paragraph {"style":{"color":{"background":"#94240b"}},"textColor":"white"} -->
      <p class="has-white-color has-text-color has-background" style="background-color:#94240b">Nota dos organizadores: Esta página é utilizada para exibir a lista de sessões para o formulário de Comentários de Palestrantes. Ela será adicionada após o conteúdo que você inserir aqui. Você pode remover esta nota.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Você pode demonstrar seu apreço e contribuir com a comunidade deixando comentários construtivos. Isso não só ajuda os palestrantes a saber o que funcionou em sua apresentação e o que não funcionou, mas também ajuda os organizadores a ter uma ideia de quão bem-sucedido foi o evento como um todo.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Os comentários que você deixar serão exibidos apenas para palestrantes e organizadores.</p>
      <!-- /wp:paragraph -->
