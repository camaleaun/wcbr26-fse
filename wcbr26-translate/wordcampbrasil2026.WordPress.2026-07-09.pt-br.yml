  -
    post_id: 20
    title: Código de Conduta
    content: |
      <!-- wp:paragraph {"metadata":{"noteId":[5],"blockVisibility":false},"style":{"color":{"background":"#eeeeee"}}} -->
      <p class="has-background" style="background-color:#eeeeee"><em>Nota dos organizadores:</em> Abaixo está um modelo de código de conduta que você pode personalizar; outro ótimo exemplo é a política anti-assédio da Ada Initiative <a href="http://geekfeminism.wikia.com/wiki/Conference_anti-harassment/Policy">anti-harassment policy.</a></p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph {"metadata":{"noteId":[6],"blockVisibility":false},"style":{"color":{"background":"#eeeeee"}}} -->
      <p class="has-background" style="background-color:#eeeeee">Também recomendamos que a equipe organizadora leia este artigo sobre <a href="http://geekfeminism.wikia.com/wiki/Conference_anti-harassment/Responding_to_reports">como receber um relato de assédio</a></p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph {"metadata":{"noteId":[7],"blockVisibility":false},"style":{"color":{"background":"#eeeeee"}}} -->
      <p class="has-background" style="background-color:#eeeeee">Por favor, atualize as partes <span style="color: red;text-decoration: underline">com texto em vermelho.</span> Para remover a formatação de sublinhado vermelho, clique na seta na barra de ferramentas chamada "mais controles de rich text" e alterne o sublinhado.</p>
      <!-- /wp:paragraph -->

      <!-- wp:heading {"level":3} -->
      <h3 class="wp-block-heading">1. Propósito</h3>
      <!-- /wp:heading -->

      <!-- wp:paragraph -->
      <p>O <span style="color: red;text-decoration: underline">WordCamp Brasil</span> acredita que nossa comunidade deve ser verdadeiramente aberta para todos. Por isso, estamos comprometidos em proporcionar um ambiente amigável, seguro e acolhedor para todos, independentemente de gênero, orientação sexual, deficiência, etnia, religião, idade, casta, classe social, sistema operacional preferido, linguagem de programação ou editor de texto, entre outras características identificadoras.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Este código de conduta descreve nossas expectativas quanto ao comportamento dos participantes, bem como as consequências de comportamentos inaceitáveis.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Convidamos todos os patrocinadores, voluntários, palestrantes, participantes e demais convidados a nos ajudar a criar uma experiência de conferência segura e positiva para todos.</p>
      <!-- /wp:paragraph -->

      <!-- wp:heading {"level":3} -->
      <h3 class="wp-block-heading">2. Cidadania do Código Aberto</h3>
      <!-- /wp:heading -->

      <!-- wp:paragraph -->
      <p>Um objetivo complementar deste código de conduta é aumentar a cidadania do código aberto, incentivando os participantes a reconhecer e fortalecer as relações entre o que fazemos e a comunidade em geral.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Em prol desse objetivo, os organizadores do <span style="color: red;text-decoration: underline">WordCamp Brasil</span> receberão indicações de cidadãos exemplares durante o evento e reconhecerão participantes selecionados após a conferência no site.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Se você vir alguém que está fazendo um esforço extra para garantir que nossa comunidade seja acolhedora, amigável e que incentive todos os participantes a contribuir ao máximo, queremos saber. <span style="color: red;text-decoration: underline">Você pode indicar alguém na mesa de inscrição ou on-line em URL AQUI.</span></p>
      <!-- /wp:paragraph -->

      <!-- wp:heading {"level":3} -->
      <h3 class="wp-block-heading">3. Comportamento Esperado</h3>
      <!-- /wp:heading -->

      <!-- wp:list -->
      <ul class="wp-block-list"><!-- wp:list-item -->
      <li>Seja atencioso, respeitoso e colaborativo.</li>
      <!-- /wp:list-item -->

      <!-- wp:list-item -->
      <li>Abstenha-se de comportamentos e discursos depreciativos, discriminatórios ou de assédio.</li>
      <!-- /wp:list-item -->

      <!-- wp:list-item -->
      <li>Esteja atento ao seu entorno e aos demais participantes. Avise os organizadores da conferência se notar uma situação perigosa ou alguém em dificuldade.</li>
      <!-- /wp:list-item -->

      <!-- wp:list-item -->
      <li>Participe de forma autêntica e ativa. Ao fazê-lo, você ajuda a criar o <span style="color: red;text-decoration: underline">WordCamp Brasil</span> e torná-lo seu.</li>
      <!-- /wp:list-item --></ul>
      <!-- /wp:list -->

      <!-- wp:heading {"level":3} -->
      <h3 class="wp-block-heading">4. Comportamento Inaceitável</h3>
      <!-- /wp:heading -->

      <!-- wp:paragraph -->
      <p>Comportamentos inaceitáveis incluem: conduta intimidadora, de assédio, abusiva, discriminatória, depreciativa ou humilhante por parte de qualquer participante do <span style="color: red;text-decoration: underline">WordCamp Brasil</span> e eventos relacionados. Todos os locais do <span style="color: red;text-decoration: underline">WordCamp Brasil</span> podem ser compartilhados com membros do público; por favor, seja respeitoso com todos os frequentadores desses locais.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Assédio inclui: comentários verbais ofensivos relacionados a gênero, orientação sexual, raça, religião, deficiência; uso inadequado de nudez e/ou imagens sexuais em espaços públicos (incluindo slides de apresentação); intimidação deliberada, perseguição ou seguimento; fotografias ou gravações de assédio; perturbação persistente de palestras ou outros eventos; contato físico inapropriado e atenção sexual indesejada.</p>
      <!-- /wp:paragraph -->

      <!-- wp:heading {"level":3} -->
      <h3 class="wp-block-heading">5. Consequências do Comportamento Inaceitável</h3>
      <!-- /wp:heading -->

      <!-- wp:paragraph -->
      <p>Comportamentos inaceitáveis não serão tolerados por outros participantes, organizadores, equipe do local, patrocinadores ou outros frequentadores dos locais do <span style="color: red;text-decoration: underline">WordCamp Brasil</span>.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Espera-se que qualquer pessoa solicitada a interromper um comportamento inaceitável o faça imediatamente.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Se um participante se envolver em comportamento inaceitável, os organizadores da conferência poderão tomar qualquer medida que considerem adequada, incluindo a expulsão da conferência sem aviso prévio ou reembolso.</p>
      <!-- /wp:paragraph -->

      <!-- wp:heading {"level":3} -->
      <h3 class="wp-block-heading">6. O Que Fazer Se Você Testemunhar ou For Vítima de Comportamento Inaceitável</h3>
      <!-- /wp:heading -->

      <!-- wp:paragraph -->
      <p>Se você for vítima de comportamento inaceitável, perceber que outra pessoa está sendo vítima de comportamento inaceitável ou tiver qualquer outra preocupação, notifique um organizador da conferência o mais rápido possível.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>A equipe do <span style="color: red;text-decoration: underline">WordCamp Brasil</span> estará disponível para ajudar os participantes a entrar em contato com a segurança do local ou as autoridades locais, fornecer acompanhamento ou de outra forma ajudar quem estiver passando por comportamentos inaceitáveis a se sentir seguro durante a conferência. <span style="color: red;text-decoration: underline">Os voluntários estarão usando XXXXXXXXXXXXXXXXXXXXXXXX.</span> Qualquer voluntário pode conectá-lo a um organizador da conferência. Você também pode ir até o balcão especial de inscrição no saguão e pedir pelos organizadores.</p>
      <!-- /wp:paragraph -->

      <!-- wp:heading {"level":3} -->
      <h3 class="wp-block-heading">7. Escopo</h3>
      <!-- /wp:heading -->

      <!-- wp:paragraph -->
      <p>Esperamos que todos os participantes da conferência (patrocinadores, voluntários, palestrantes, participantes e outros convidados) respeitem este código de conduta em todos os locais da conferência e nos eventos sociais relacionados.</p>
      <!-- /wp:paragraph -->

      <!-- wp:heading {"level":3} -->
      <h3 class="wp-block-heading">8. Informações de Contato</h3>
      <!-- /wp:heading -->

      <!-- wp:paragraph -->
      <p><span style="color: red;text-decoration: underline">Informações de contato aqui! Certifique-se de incluir uma forma de acessar os organizadores durante o evento.</span></p>
      <!-- /wp:paragraph -->

      <!-- wp:heading {"level":3} -->
      <h3 class="wp-block-heading">9. Licença e Atribuição</h3>
      <!-- /wp:heading -->

      <!-- wp:paragraph -->
      <p>Este Código de Conduta é baseado no excelente trabalho do Open Source Bridge, com as informações do nosso evento substituídas. O original está disponível no <a href="http://web.archive.org/web/20191206083557/http://opensourcebridge.org/about/code-of-conduct/">Open Source Bridge 2018 [arquivado]</a> e é distribuído sob uma licença <a href="http://creativecommons.org/licenses/by-sa/3.0/">Creative Commons Attribution-ShareAlike</a>.</p>
      <!-- /wp:paragraph -->

      <!-- wp:heading {"level":3} -->
      <h3 class="wp-block-heading">Declaração sobre Eventos Sociais ou Complementares (quando aplicável)</h3>
      <!-- /wp:heading -->

      <!-- wp:paragraph -->
      <p>Os eventos sociais e complementares têm como objetivo oferecer oportunidades de networking e aprendizado adicional, além de uma chance de relaxar após um WordCamp completo. Eles também devem ser locais onde os participantes possam se sentir seguros e protegidos.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Queremos que você aproveite esses eventos e que o faça com segurança. Se você vivenciar uma violação do Código de Conduta, presenciar uma violação, estiver preocupado com o bem-estar, segurança ou comportamento de outro participante, ou tiver uma dúvida geral (entendemos que as violações nem sempre são óbvias!), entre em contato imediatamente notificando um organizador do WordCamp ou enviando um e-mail para <a href="mailto:report@wordcamp.org">report@wordcamp.org</a>. Para eventos presenciais, se você precisar de ajuda ou não conseguir se retirar de forma confortável e segura de uma situação indesejada, os organizadores priorizarão ajudá-lo imediata e discretamente. Alguns exemplos são: sentir-se mal; seus meios de transporte falharem; estar embriagado, estar sozinho ou com alguém em quem não confia, estar sobrecarregado, ter vivenciado ou presenciado uma violação do Código de Conduta. Por favor, peça ajuda a qualquer voluntário ou organizador do evento próximo a você.</p>
      <!-- /wp:paragraph -->
