    title: Hostinger
    content: |
      <!-- wp:paragraph -->
      <p>A <a href="https://www.hostinger.com/">Hostinger</a> cria produtos e serviços para ajudar clientes a desenvolver com sucesso sua presença on-line, oferecendo ferramentas para e-commerce, blogs, sites de portfólio e muito mais. Em 2025, o portfólio de produtos foi expandido para incluir o <a href="https://www.hostinger.com/horizons?trk=brand_horizons&amp;utm_source=google&amp;utm_source=google&amp;utm_medium=cpc&amp;utm_id=1758060185&amp;utm_campaign=Brand-Phrase|NT:Se|LO:USA&amp;utm_term=hostinger+horizons&amp;utm_content=734451715881&amp;gad_source=1&amp;gad_campaignid=1758060185&amp;gbraid=0AAAAADMy-hZWqmaJGrWk8lhW5NCAqMh9u&amp;gclid=CjwKCAjw7vzOBhBxEiwAc7WNryJiMGVwypmMPOGbDDwdOT_o-z2wHyV4JDy-80BMTfM4sUzPwu_2-xoCY8MQAvD_BwE">Hostinger Horizons</a>, uma solução simples para criar aplicativos web.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>A empresa foi fundada na Lituânia em 2004. Sua equipe internacional é composta atualmente por cerca de 900 profissionais. Por seis anos consecutivos, a Hostinger foi destaque no ranking anual FT 1000 do Financial Times das empresas de crescimento mais rápido da Europa. Não apenas o negócio da empresa cresce de forma consistente, mas também o reconhecimento de sua marca — de acordo com o Google Trends, a Hostinger é agora o segundo provedor de hospedagem mais pesquisado no mundo.</p>
      <!-- /wp:paragraph -->
  -
    post_id: 23
    title: Automattic
    content: |
      <!-- wp:paragraph -->
      <p>Na <a href="https://automattic.com/about/" target="_blank" rel="noreferrer noopener">Automattic</a>, <em>somos</em>&nbsp;apaixonados por tornar&nbsp;<em>a&nbsp;web</em>&nbsp;um lugar&nbsp;melhor.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Somos as pessoas por trás do&nbsp;<a href="https://wordpress.com/">WordPress.com</a>,&nbsp;<a href="https://woocommerce.com/">WooCommerce</a>,&nbsp;<a href="https://jetpack.com/">Jetpack</a>,&nbsp;<a href="https://wpvip.com/">WordPress VIP</a>,&nbsp;<a href="https://simplenote.com/">Simplenote</a>,&nbsp;<a href="https://longreads.com/">Longreads</a>,&nbsp;<a href="http://wpscan.com/">WPScan</a>,&nbsp;<a href="https://akismet.com/">Akismet</a>,&nbsp;<a href="https://en.gravatar.com/">Gravatar</a>,&nbsp;<a href="https://crowdsignal.com/">Crowdsignal</a>,&nbsp;<a href="https://cloudup.com/">Cloudup</a>,&nbsp;<a href="https://www.tumblr.com/">Tumblr</a>,&nbsp;<a href="https://dayoneapp.com/">Day One</a>,&nbsp;<a href="https://www.pocketcasts.com/">Pocket Casts</a> e muito mais. Acreditamos em tornar a web um lugar melhor.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p><a href="https://distributed.blog/">Somos uma empresa distribuída</a>&nbsp;com 2.007 Automatticians em 97 países falando 123 idiomas diferentes. Estamos comprometidos com&nbsp;<a href="https://automattic.com/diversity-and-inclusion/">diversidade, equidade e inclusão</a>, e nosso objetivo comum é democratizar a publicação e o comércio para que qualquer pessoa com uma história possa contá-la, e qualquer pessoa com um produto possa vendê-lo, independentemente de renda, gênero, política, idioma ou onde vivam no mundo.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p><a href="https://github.com/Automattic">Acreditamos no código aberto</a>&nbsp;e a grande maioria do nosso trabalho está disponível sob a GPL.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>Nos esforçamos para viver de acordo com o&nbsp;<a href="https://automattic.com/creed/">Automattic Creed</a>.</p>
      <!-- /wp:paragraph -->

      <!-- wp:paragraph -->
      <p>A Automattic é uma&nbsp;<a href="https://mostlovedworkplace.com/companies/automattic-inc/">Most Loved Company</a>&nbsp;e&nbsp;<a href="https://disabilityconfident.campaign.gov.uk/">Disability Confident Committed</a>. (Aqui está&nbsp;<a href="https://happinessengineer.blog/2022/09/08/happiness-for-everyone-working-with-a-disability-at-automattic/">o que isso pode significar para você</a>.) Venha&nbsp;<a href="https://automattic.com/work-with-us/">trabalhar conosco</a>.</p>
      <!-- /wp:paragraph -->
