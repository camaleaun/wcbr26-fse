    pub_date: 20260623T174908
    creator: Brightsol
    guid:
      value: https://brasil.wordcamp.org/2026/?p=23
      isPermaLink: 'false'
    content: |
      <!-- wp:paragraph -->
      <p>At <a href="https://automattic.com/about/" target="_blank" rel="noreferrer noopener">Automattic</a>, <em>we are</em>&nbsp;passionate about making&nbsp;<em>the&nbsp;web</em>&nbsp;a better&nbsp;place.</p>
      <!-- /wp:paragraph -->
      
      <!-- wp:paragraph -->
      <p>We are the people behind&nbsp;<a href="https://wordpress.com/">WordPress.com</a>,&nbsp;<a href="https://woocommerce.com/">WooCommerce</a>,&nbsp;<a href="https://jetpack.com/">Jetpack</a>,&nbsp;<a href="https://wpvip.com/">WordPress VIP</a>,&nbsp;<a href="https://simplenote.com/">Simplenote</a>,&nbsp;<a href="https://longreads.com/">Longreads</a>,&nbsp;<a href="http://wpscan.com/">WPScan</a>,&nbsp;<a href="https://akismet.com/">Akismet</a>,&nbsp;<a href="https://en.gravatar.com/">Gravatar</a>,&nbsp;<a href="https://crowdsignal.com/">Crowdsignal</a>,&nbsp;<a href="https://cloudup.com/">Cloudup</a>,&nbsp;<a href="https://www.tumblr.com/">Tumblr</a>,&nbsp;<a href="https://dayoneapp.com/">Day One</a>,&nbsp;<a href="https://www.pocketcasts.com/">Pocket Casts</a>, and more. We believe in making the web a better place.</p>
      <!-- /wp:paragraph -->
      
      <!-- wp:paragraph -->
      <p><a href="https://distributed.blog/">We’re a distributed company</a>&nbsp;with 2,007 Automatticians in 97 countries speaking 123 different languages. We’re committed to&nbsp;<a href="https://automattic.com/diversity-and-inclusion/">diversity, equity, and inclusion</a>, and our common goal is to democratize publishing and commerce so that anyone with a story can tell it, and anyone with a product can sell it, regardless of income, gender, politics, language, or where they live in the world.</p>
      <!-- /wp:paragraph -->
      
      <!-- wp:paragraph -->
      <p><a href="https://github.com/Automattic">We believe in Open Source</a>&nbsp;and the vast majority of our work is available under the GPL.</p>
      <!-- /wp:paragraph -->
      
      <!-- wp:paragraph -->
      <p>We strive to live by the&nbsp;<a href="https://automattic.com/creed/">Automattic Creed</a>.</p>
      <!-- /wp:paragraph -->
      
      <!-- wp:paragraph -->
      <p>Automattic is a&nbsp;<a href="https://mostlovedworkplace.com/companies/automattic-inc/">Most Loved Company</a>&nbsp;and&nbsp;<a href="https://disabilityconfident.campaign.gov.uk/">Disability Confident Committed</a>. (Here’s&nbsp;<a href="https://happinessengineer.blog/2022/09/08/happiness-for-everyone-working-with-a-disability-at-automattic/">what that might mean for you</a>.) Come&nbsp;<a href="https://automattic.com/work-with-us/">work with us</a>.</p>
      <!-- /wp:paragraph -->
