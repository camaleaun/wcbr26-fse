    content: |
      <!-- wp:paragraph -->
      <p><a href="https://www.hostinger.com/">Hostinger</a> creates products and services to help clients successfully develop their online presence, offering tools for e-commerce, blogs, portfolio websites, and more. In 2025, the product portfolio was expanded to include <a href="https://www.hostinger.com/horizons?trk=brand_horizons&amp;utm_source=google&amp;utm_source=google&amp;utm_medium=cpc&amp;utm_id=1758060185&amp;utm_campaign=Brand-Phrase|NT:Se|LO:USA&amp;utm_term=hostinger+horizons&amp;utm_content=734451715881&amp;gad_source=1&amp;gad_campaignid=1758060185&amp;gbraid=0AAAAADMy-hZWqmaJGrWk8lhW5NCAqMh9u&amp;gclid=CjwKCAjw7vzOBhBxEiwAc7WNryJiMGVwypmMPOGbDDwdOT_o-z2wHyV4JDy-80BMTfM4sUzPwu_2-xoCY8MQAvD_BwE">Hostinger Horizons</a>, a simple web app-building solution.</p>
      <!-- /wp:paragraph -->
      
      <!-- wp:paragraph -->
      <p>The company was founded in Lithuania in 2004. Its international team currently consists of around 900 professionals. For six consecutive years, Hostinger has been featured in the Financial Times’ annual FT 1000 ranking of Europe’s fastest-growing companies. Not only is the company's business consistently growing, but so is its brand awareness – according to Google Trends, Hostinger is now the second most searched hosting provider in the world.</p>
      <!-- /wp:paragraph -->
      
      <!-- wp:paragraph -->
      <p></p>
      <!-- /wp:paragraph -->
